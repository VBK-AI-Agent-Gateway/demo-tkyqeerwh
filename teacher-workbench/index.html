<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师教学工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 左侧固定导航 -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-logo">教</span>
      <span class="brand-text">教学工作台</span>
    </div>
    <nav id="sideNav">
      <a href="#/dashboard" data-nav="dashboard" class="nav-item active"><span class="ni-ico">▦</span><span class="ni-text">首页仪表盘</span></a>
      <a href="#/lesson-prep" data-nav="lesson-prep" class="nav-item"><span class="ni-ico">✎</span><span class="ni-text">课程备课</span></a>
      <a href="#/lesson-plans" data-nav="lesson-plans" class="nav-item"><span class="ni-ico">▤</span><span class="ni-text">教案管理</span></a>
      <a href="#/courseware" data-nav="courseware" class="nav-item"><span class="ni-ico">▣</span><span class="ni-text">课件中心</span></a>
      <a href="#/question-bank" data-nav="question-bank" class="nav-item"><span class="ni-ico">❓</span><span class="ni-text">题库管理</span></a>
      <a href="#/scores" data-nav="scores" class="nav-item"><span class="ni-ico">📈</span><span class="ni-text">学生成绩</span></a>
      <a href="#/reflection" data-nav="reflection" class="nav-item"><span class="ni-ico">↺</span><span class="ni-text">教学复盘</span></a>
      <a href="#/planning" data-nav="planning" class="nav-item"><span class="ni-ico">▧</span><span class="ni-text">教学计划</span></a>
    </nav>
    <div class="sidebar-foot">
      <button id="collapseBtn" class="btn btn-ghost btn-sm" title="收起/展开侧边栏">⇤ 收起</button>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main-wrap">
    <header class="topbar">
      <button id="sideToggle" class="btn btn-ghost btn-icon" title="展开侧边栏">☰</button>
      <div class="crumbs"><nav id="breadcrumb"></nav></div>
      <div class="search-box">
        <input id="globalSearch" type="search" placeholder="全局搜索：教案 / 课件 / 题目 / 学生 …" autocomplete="off">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="top-actions">
        <span id="draftStatus" class="draft-status"></span>
        <button id="exportBtn" class="btn btn-ghost btn-sm" title="导出全部数据备份">导出备份</button>
        <span class="avatar" title="当前用户">王</span>
      </div>
    </header>

    <main id="content" class="content"></main>
  </div>
</div>

<!-- 侧滑抽屉 -->
<div id="drawerMask" class="drawer-mask hidden"></div>
<aside id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <h3 id="drawerTitle">新增</h3>
    <button id="drawerClose" class="btn btn-ghost btn-icon">✕</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
  <div class="drawer-foot">
    <button id="drawerCancel" class="btn btn-ghost">取消</button>
    <button id="drawerSave" class="btn btn-primary">保存</button>
  </div>
</aside>

<!-- 右键菜单 -->
<div id="ctxMenu" class="ctx-menu hidden"></div>

<!-- 提示 -->
<div id="toast" class="toast hidden"></div>

<input type="file" id="importFile" accept="application/json" class="hidden">
<input type="file" id="uploadFile" class="hidden">
<input type="file" id="richTextFile" accept="image/*" class="hidden">

<script src="data.js"></script>
<script src="app.js"></script>
<script src="modules.js"></script>
<script src="modules-b.js"></script>
</body>
</html>
