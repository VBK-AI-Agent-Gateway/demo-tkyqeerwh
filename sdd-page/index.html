<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDD Flow · 规格驱动开发</title>
<style>
:root{--bg:#0e1117;--card:#171c26;--line:#2a3242;--fg:#e8ecf3;--muted:#9aa6bb;--accent:#5eead4;--accent2:#818cf8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{padding:64px 0 48px;text-align:center}
h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:12px;font-size:1.1rem;max-width:640px;margin-left:auto;margin-right:auto}
.cta{display:inline-block;margin-top:24px;padding:12px 28px;border-radius:999px;background:var(--accent);color:#05201b;font-weight:700;text-decoration:none}
.cta:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:24px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h2{font-size:1.25rem;color:var(--accent);margin-bottom:10px}
.card ul{list-style:none;color:var(--muted);font-size:.95rem}
.card li{padding:6px 0;border-bottom:1px dashed var(--line)}
.card li:last-child{border-bottom:none}
.card li::before{content:"▸ ";color:var(--accent2)}
.demo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:64px}
.demo h2{margin-bottom:16px;font-size:1.3rem}
.task{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:8px}
.task:hover{background:#1d2330}
.task input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.task.done label{color:var(--muted);text-decoration:line-through}
label{cursor:pointer;user-select:none}
.bar{margin-top:18px;height:10px;background:#10141c;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
#pct{margin-top:8px;color:var(--muted);font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 0 40px}
@media (max-width:1023px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:767px){.grid{grid-template-columns:1fr}header{padding:44px 0 32px}}
</style>
</head>
<body>
<header class="wrap">
  <h1>用 <span>SDD</span> 驱动你的开发流程</h1>
  <p class="sub">先写规格（SPEC），再定方案（PLAN），拆成任务（TASKS），逐项执行并验证——本页即用该流程构建。</p>
  <a class="cta" href="#demo">试玩任务清单</a>
</header>
<main class="wrap">
  <section class="grid" aria-label="SDD 三段流程">
    <article class="card"><h2>SPEC</h2><ul><li>一句话目标</li><li>完成态定义</li><li>验收标准</li></ul></article>
    <article class="card"><h2>PLAN</h2><ul><li>技术选型</li><li>文件结构</li><li>部署方式</li></ul></article>
    <article class="card"><h2>TASKS</h2><ul><li>5–8 个小任务</li><li>每个 5 分钟内</li><li>逐个执行打勾</li></ul></article>
  </section>
  <section class="demo" id="demo" aria-label="任务清单演示">
    <h2>任务清单 Demo</h2>
    <div class="task"><input type="checkbox" id="t1" checked><label for="t1">T1 环境与密钥检查</label></div>
    <div class="task"><input type="checkbox" id="t2" checked><label for="t2">T2 编写 README 规格</label></div>
    <div class="task"><input type="checkbox" id="t3" checked><label for="t3">T3 实现 index.html</label></div>
    <div class="task"><input type="checkbox" id="t4" checked><label for="t4">T4 本地校验页面</label></div>
    <div class="task"><input type="checkbox" id="t5"><label for="t5">T5 无障碍与截图证据</label></div>
    <div class="task"><input type="checkbox" id="t6"><label for="t6">T6 提交到 demo-test</label></div>
    <div class="task"><input type="checkbox" id="t7"><label for="t7">T7 push main 分支</label></div>
    <div class="task"><input type="checkbox" id="t8"><label for="t8">T8 验证 Pages 已构建</label></div>
    <div class="bar" role="progressbar" aria-label="完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="bar"><i id="fill"></i></div>
    <p id="pct">已完成 4 / 8（50%）</p>
  </section>
</main>
<footer>SDD Flow Demo · 静态托管于 GitHub Pages</footer>
<script>
const boxes=[...document.querySelectorAll('.task input')];
const fill=document.getElementById('fill'),pct=document.getElementById('pct'),bar=document.getElementById('bar');
function upd(){
  const n=boxes.filter(b=>b.checked).length, p=Math.round(n/boxes.length*100);
  fill.style.width=p+'%'; pct.textContent=`已完成 ${n} / ${boxes.length}（${p}%）`;
  bar.setAttribute('aria-valuenow',p);
  boxes.forEach(b=>b.closest('.task').classList.toggle('done',b.checked));
}
boxes.forEach(b=>b.addEventListener('change',upd));
upd();
</script>
</body>
</html>
