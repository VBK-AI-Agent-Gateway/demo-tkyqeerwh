<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片替换：月饼 → 啤酒杯</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>月饼 <span class="arrow">→</span> 啤酒杯 图片替换</h1>
    <p class="sub">人物手中物品已由月饼替换为啤酒杯，修改后的图片可直接下载。</p>
  </div>
</header>

<main class="wrap">
  <div class="compare">
    <figure class="shot">
      <div class="badge badge-old">修改前</div>
      <img src="before.png" alt="修改前：人物手持月饼">
      <figcaption>人物手中：月饼 🥮</figcaption>
    </figure>
    <figure class="shot shot-new">
      <div class="badge badge-new">修改后</div>
      <img src="after.png" alt="修改后：人物手持啤酒杯">
      <figcaption>人物手中：啤酒杯 🍺</figcaption>
      <a class="btn" href="after.png" download="mooncake-to-beer.png">⬇ 下载修改后的图片</a>
    </figure>
  </div>

  <section class="card">
    <h2>说明</h2>
    <ul>
      <li>原图中人物手部区域的月饼已被替换为带泡沫与把手的啤酒杯，姿态与手部位置保持一致。</li>
      <li>修改后图片：720×900 PNG，可点击上方按钮直接下载。</li>
      <li>如需在你的原图上执行同样替换，把原图发我即可按同款流程处理。</li>
    </ul>
  </section>
</main>

<footer class="foot">Teacher-era demo · 月饼替换啤酒杯 · static page</footer>
</body>
</html>
